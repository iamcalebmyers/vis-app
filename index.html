<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vis-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Vis — chat-first AI real estate analysis. See the market clearly." />
    <title>Vis · See the market clearly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vis-theme');
          var theme = (stored && stored !== 'system') ? stored : 'light';
          if (theme === 'charcoal' || theme === 'black') {
            document.documentElement.dataset.theme = theme;
          }
          // light = no dataset.theme attribute needed (default :root vars)
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
